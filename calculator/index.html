<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸带计算器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* 布局：手机计算器式的单列机身（显示屏在上，4×5 圆形按键在下）；宽屏时右侧并排显示历史记录。
   刻意只用一套深色外观，与手机计算器一致。 */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #8e8e93;
  --key-num: #333333;
  --key-num-hi: #737373;
  --key-fn: #a5a5a5;
  --key-fn-fg: #000000;
  --key-fn-hi: #d9d9d9;
  --key-op: #ff9f0a;
  --key-op-hi: #fcc78d;
  --panel: #1c1c1e;
  --line: #2c2c2e;
  --error: #ff6961;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  --gap: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
  gap: 32px;
  align-items: end;
}
@media (max-width: 680px) {
  .wrap { grid-template-columns: minmax(0, 1fr); max-width: 380px; align-items: start; }
  body { padding-block: 12px 20px; }
}

/* 机身 */
.calc { display: grid; gap: 18px; }

.screen {
  min-height: 176px;
  display: grid;
  align-content: end;
  gap: 2px;
  text-align: right;
  padding: 0 8px;
  font-variant-numeric: tabular-nums;
  cursor: copy;
  position: relative;
  outline: none;
}
.screen:focus-visible { box-shadow: inset 0 -2px 0 var(--key-op); }
.sub {
  min-height: 1.5em;
  color: var(--muted);
  font-size: 22px;
  font-weight: 400;
  overflow-wrap: anywhere;
}
.main {
  font-size: 84px;
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
  direction: ltr;
}
.main.error { color: var(--error); font-size: 34px; font-weight: 400; white-space: normal; letter-spacing: 0; }
.toast {
  position: absolute; left: 8px; top: 8px;
  font-size: 13px; color: var(--key-op);
  opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }

.keys {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.key {
  appearance: none;
  border: 0;
  border-radius: 50%;
  aspect-ratio: 1;
  width: 100%;
  max-width: 100%;
  background: var(--key-num);
  color: var(--fg);
  font-family: var(--font);
  font-size: 36px;
  font-weight: 400;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  transition: background-color .35s ease-out, color .35s ease-out;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.key:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.key:active, .key.pressed { background: var(--key-num-hi); transition: none; }

.key.fn { background: var(--key-fn); color: var(--key-fn-fg); font-size: 30px; font-weight: 500; }
.key.fn:active, .key.fn.pressed { background: var(--key-fn-hi); }
.key.fn.txt { font-size: 28px; }
.key.fn svg { width: 34px; height: 34px; }

.key.op { background: var(--key-op); color: var(--fg); font-size: 42px; font-weight: 400; }
.key.op:active, .key.op.pressed { background: var(--key-op-hi); }
/* 选中的运算符：反色显示，等待第二个数 */
.key.op.selected { background: var(--fg); color: var(--key-op); transition: none; }

.key.paren { font-size: 28px; letter-spacing: .06em; }

.hint { margin: 4px 8px 0; font-size: 12px; color: var(--muted); line-height: 1.7; }
.hint kbd {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
  background: var(--panel); border-radius: 4px; padding: 1px 5px; color: var(--fg);
}

/* 历史记录 */
.tape {
  background: var(--panel);
  border-radius: 20px;
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  max-height: 640px;
  overflow: hidden;
}
@media (max-width: 680px) { .tape { max-height: 420px; } }
.tape-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
}
.tape-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.tape-head h2 span { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.clear-btn {
  appearance: none; border: 0; background: none; color: var(--key-op);
  font: inherit; font-size: 15px; cursor: pointer; padding: 4px 6px; border-radius: 8px;
}
.clear-btn[disabled] { color: var(--muted); cursor: default; opacity: .5; }
.clear-btn:focus-visible { outline: 2px solid var(--key-op); }
.tape-list {
  list-style: none; margin: 0; padding: 0 0 8px;
  overflow-y: auto;
  font-variant-numeric: tabular-nums;
}
.tape-list li button {
  appearance: none; border: 0; background: none; color: inherit; font: inherit;
  width: 100%; text-align: right; cursor: pointer;
  padding: 12px 18px;
  display: grid; gap: 2px;
  border-bottom: 1px solid var(--line);
}
.tape-list li:last-child button { border-bottom: 0; }
.tape-list li button:hover { background: var(--line); }
.tape-list li button:focus-visible { outline: 2px solid var(--key-op); outline-offset: -2px; }
.tape-list .e { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.tape-list .r { font-size: 24px; font-weight: 300; overflow-wrap: anywhere; }
.empty {
  padding: 40px 18px; color: var(--muted); line-height: 1.7; text-align: center; font-size: 14px;
}

@media (prefers-reduced-motion: reduce) {
  .key, .toast { transition: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="calc" aria-label="计算器">
    <div class="screen" id="screen" tabindex="0" role="button" aria-label="点击复制结果">
      <span class="toast" id="toast">已复制</span>
      <div class="sub" id="sub" aria-live="polite"></div>
      <div class="main" id="main" aria-live="polite">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="key fn txt" id="k-clr" data-k="CLR" aria-label="全部清除">AC</button>
      <button class="key fn" id="k-neg" data-k="±" aria-label="正负号">±</button>
      <button class="key fn" id="k-pct" data-k="%" aria-label="百分比">%</button>
      <button class="key op" id="k-div" data-k="÷" aria-label="除">÷</button>

      <button class="key" id="k-7" data-k="7">7</button>
      <button class="key" id="k-8" data-k="8">8</button>
      <button class="key" id="k-9" data-k="9">9</button>
      <button class="key op" id="k-mul" data-k="×" aria-label="乘">×</button>

      <button class="key" id="k-4" data-k="4">4</button>
      <button class="key" id="k-5" data-k="5">5</button>
      <button class="key" id="k-6" data-k="6">6</button>
      <button class="key op" id="k-sub" data-k="−" aria-label="减">−</button>

      <button class="key" id="k-1" data-k="1">1</button>
      <button class="key" id="k-2" data-k="2">2</button>
      <button class="key" id="k-3" data-k="3">3</button>
      <button class="key op" id="k-add" data-k="+" aria-label="加">+</button>

      <button class="key paren" id="k-paren" data-k="()" aria-label="括号">( )</button>
      <button class="key" id="k-0" data-k="0">0</button>
      <button class="key" id="k-dot" data-k="." aria-label="小数点">.</button>
      <button class="key op" id="k-eq" data-k="=" aria-label="等于">=</button>
    </div>

    <p class="hint">输入时左上角是退格键 ⌫，长按可全部清除。<kbd>( )</kbd> 键会自动判断开括号还是闭括号。键盘可用：数字、<kbd>+ - * /</kbd>、<kbd>( )</kbd>、<kbd>%</kbd>、<kbd>Enter</kbd>、<kbd>Backspace</kbd>、<kbd>Esc</kbd>。点击数字可复制结果。</p>
  </section>

  <section class="tape" aria-label="历史记录">
    <div class="tape-head">
      <h2>历史记录<span id="count"></span></h2>
      <button class="clear-btn" id="clear-tape">清除</button>
    </div>
    <ul class="tape-list" id="tape"></ul>
  </section>
</main>

<script>
(() => {
  "use strict";

  const OPS = "+−×÷";
  const STORE_KEY = "paper-tape-calc-history";

  // ---------- 状态 ----------
  let expr = "";          // 当前输入的表达式（使用显示字符 + − × ÷）
  let evaluated = false;  // 刚按过 =
  let lastResult = null;  // 上次结果（数字）
  let errorMsg = "";
  let history = loadHistory();

  // ---------- 解析与求值（递归下降，不使用 eval） ----------
  function tokenize(s) {
    const tokens = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) {
        const m = /^(\d*\.?\d*)(e[+-]?\d+)?/.exec(s.slice(i));
        const text = m[0];
        if (text === ".") throw new Error("表达式不完整");
        tokens.push({ t: "num", v: parseFloat(text) });
        i += text.length;
      } else if ("+−×÷()%".includes(c)) {
        tokens.push({ t: c });
        i++;
      } else {
        throw new Error("无法识别的字符");
      }
    }
    return tokens;
  }

  function evaluate(s) {
    const tokens = tokenize(s);
    let pos = 0;
    const peek = () => tokens[pos] && tokens[pos].t;

    function parseExpr() {
      let v = parseTerm();
      while (peek() === "+" || peek() === "−") {
        const op = tokens[pos++].t;
        const r = parseTerm();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    function parseTerm() {
      let v = parseUnary();
      for (;;) {
        const p = peek();
        if (p === "×" || p === "÷") {
          pos++;
          const r = parseUnary();
          if (p === "÷") {
            if (r === 0) throw new Error("不能除以 0");
            v = v / r;
          } else v = v * r;
        } else if (p === "(" || p === "num") {
          v = v * parseUnary();   // 隐式乘法：2(3) 或 (2)(3)
        } else break;
      }
      return v;
    }
    function parseUnary() {
      if (peek() === "−") { pos++; return -parseUnary(); }
      if (peek() === "+") { pos++; return parseUnary(); }
      return parsePostfix();
    }
    function parsePostfix() {
      let v = parsePrimary();
      while (peek() === "%") { pos++; v = v / 100; }
      return v;
    }
    function parsePrimary() {
      const tk = tokens[pos];
      if (!tk) throw new Error("表达式不完整");
      if (tk.t === "num") { pos++; return tk.v; }
      if (tk.t === "(") {
        pos++;
        const v = parseExpr();
        if (peek() === ")") pos++;
        else if (pos < tokens.length) throw new Error("括号不匹配");
        return v;
      }
      throw new Error("表达式不完整");
    }

    const v = parseExpr();
    if (pos < tokens.length) throw new Error("括号不匹配");
    if (!isFinite(v)) throw new Error("结果超出范围");
    return parseFloat(v.toPrecision(12));   // 去掉二进制浮点误差，如 0.1 + 0.2
  }

  // ---------- 格式化 ----------
  function formatNumber(n) {
    if (Object.is(n, -0)) n = 0;
    const a = Math.abs(n);
    if (a !== 0 && (a >= 1e15 || a < 1e-9)) {
      return n.toExponential(8).replace(/\.?0+e/, "e").replace("e+", "e").replace("-", "−");
    }
    // 1e-7 这类小数 String() 会给出指数形式，改用定点写法
    const plain = String(a).includes("e") ? a.toFixed(12).replace(/\.?0+$/, "") : String(a);
    const [int, frac] = plain.split(".");
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (n < 0 ? "−" : "") + grouped + (frac ? "." + frac : "");
  }
  function numberToExpr(n) {
    if (Object.is(n, -0)) n = 0;
    let s = String(n);
    if (s.includes("e")) s = n.toExponential();
    return s.replace(/^-/, "−");
  }
  function prettyExpr(s) {
    return s.replace(/\d+(\.\d*)?(e[+-]?\d+)?/g, m => {
      if (m.includes("e")) return m;
      const [i, f] = m.split(".");
      return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (f !== undefined ? "." + f : "");
    });
  }

  // ---------- 输入辅助 ----------
  const last = () => expr.slice(-1);
  const isDigit = c => /[0-9]/.test(c);
  const openCount = () => (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
  const currentNumber = () => { const m = /(\d*\.?\d*(e[+-]?\d+)?)$/.exec(expr); return m ? m[0] : ""; };

  function startFresh() {
    if (evaluated || errorMsg) { expr = ""; evaluated = false; errorMsg = ""; }
  }
  function continueFromResult() {
    if (errorMsg) { expr = ""; errorMsg = ""; }
    if (evaluated) { expr = lastResult === null ? "" : numberToExpr(lastResult); evaluated = false; }
  }
  // 左上角键：有输入时是退格，没有输入或刚出结果时是 AC
  const clrIsBackspace = () => !evaluated && !errorMsg && expr !== "";

  function input(k) {
    if (/^[0-9]$/.test(k)) {
      startFresh();
      if (last() === ")" || last() === "%") expr += "×";
      const cur = currentNumber();
      if (cur === "0") expr = expr.slice(0, -1);
      if (cur.replace(".", "").length >= 15) return;
      expr += k;
    } else if (k === ".") {
      startFresh();
      const cur = currentNumber();
      if (cur.includes(".") || cur.includes("e")) return;
      if (last() === ")" || last() === "%") expr += "×";
      expr += isDigit(last()) ? "." : "0.";
    } else if (OPS.includes(k)) {
      continueFromResult();
      if (expr === "") { expr = k === "−" ? "−" : "0" + k; }
      else if (last() === "(") { if (k === "−") expr += k; }
      else if (OPS.includes(last())) {
        if (k === "−" && (last() === "×" || last() === "÷")) expr += k;      // 5×−3
        else {
          expr = expr.replace(/[+−×÷]+$/, "");
          if (expr === "" || last() === "(") { if (k === "−") expr += k; }
          else expr += k;
        }
      } else if (last() === ".") expr = expr.slice(0, -1) + k;
      else expr += k;
    } else if (k === "(") {
      startFresh();
      if (isDigit(last()) || last() === ")" || last() === "%" || last() === ".") expr += "×";
      expr += "(";
    } else if (k === ")") {
      if (evaluated || errorMsg) return;
      if (openCount() > 0 && !OPS.includes(last()) && last() !== "(") expr += ")";
    } else if (k === "()") {
      // 智能括号：能闭合就闭合，否则开一个新括号
      const canClose = !evaluated && !errorMsg && openCount() > 0 && !OPS.includes(last()) && last() !== "(";
      input(canClose ? ")" : "(");
      return;
    } else if (k === "%") {
      continueFromResult();
      if (isDigit(last()) || last() === ")" || last() === ".") expr += "%";
    } else if (k === "±") {
      continueFromResult();
      toggleSign();
    } else if (k === "CLR") {
      input(clrIsBackspace() ? "BS" : "AC");
      return;
    } else if (k === "BS") {
      if (errorMsg) { errorMsg = ""; }
      else if (evaluated) { evaluated = false; expr = lastResult === null ? "" : numberToExpr(lastResult); }
      else expr = expr.slice(0, -1);
    } else if (k === "AC") {
      expr = ""; evaluated = false; errorMsg = "";
    } else if (k === "=") {
      equals();
      return;
    }
    render();
  }

  function toggleSign() {
    const cur = currentNumber();
    if (!cur) {
      if (expr === "" || last() === "(" || last() === "×" || last() === "÷") expr += "−";
      else if (last() === "−") {
        const before = expr.slice(0, -1);
        if (before === "" || /[+−×÷(]$/.test(before)) expr = before;
      }
      return;
    }
    const idx = expr.length - cur.length;
    const before = expr.slice(0, idx);
    const prev = before.slice(-1);
    const prevPrev = before.slice(-2, -1);
    if (prev === "−" && (before.length === 1 || /[+−×÷(]/.test(prevPrev))) {
      expr = before.slice(0, -1) + cur;               // 去掉一元负号
    } else if (prev === "+") {
      expr = before.slice(0, -1) + "−" + cur;          // a+b → a−b
    } else if (prev === "−") {
      expr = before.slice(0, -1) + "+" + cur;          // a−b → a+b
    } else {
      expr = before + "−" + cur;                       // 加上一元负号
    }
  }

  function closedExpr() {
    const s = expr.replace(/[+−×÷(]+$/, "");
    const n = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    return s + ")".repeat(Math.max(0, n));
  }

  function equals() {
    if (evaluated || errorMsg || expr === "") return;
    const full = closedExpr();
    if (full === "") return;
    try {
      const v = evaluate(full);
      lastResult = v;
      evaluated = true;
      history.unshift({ e: full, r: v });
      history = history.slice(0, 100);
      saveHistory();
      expr = full;
    } catch (err) {
      errorMsg = err.message;
    }
    render();
    renderTape();
  }

  // ---------- 渲染 ----------
  const $main = document.getElementById("main");
  const $sub = document.getElementById("sub");
  const $clr = document.getElementById("k-clr");
  const opKeys = [...document.querySelectorAll(".key.op:not(#k-eq)")];
  const BS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>';

  // 按显示区宽度自动缩小字号，长数字不换行
  function fitMain() {
    $main.style.fontSize = "";
    const max = $main.clientWidth;
    let size = 84;
    while ($main.scrollWidth > max && size > 28) {
      size -= 4;
      $main.style.fontSize = size + "px";
    }
  }

  function render() {
    // 左上角键的状态
    if (clrIsBackspace()) {
      $clr.innerHTML = BS_ICON; $clr.setAttribute("aria-label", "退格（长按全部清除）");
    } else {
      $clr.textContent = "AC"; $clr.setAttribute("aria-label", "全部清除");
    }
    // 刚输入运算符时高亮该运算符
    const pending = !evaluated && !errorMsg && OPS.includes(last()) ? last() : "";
    opKeys.forEach(b => b.classList.toggle("selected", b.dataset.k === pending));

    $main.classList.toggle("error", !!errorMsg);
    if (errorMsg) {
      $sub.textContent = prettyExpr(closedExpr());
      $main.textContent = errorMsg;
      $main.style.fontSize = "";
      return;
    }
    if (evaluated) {
      $sub.textContent = prettyExpr(expr) + " =";
      $main.textContent = formatNumber(lastResult);
      fitMain();
      return;
    }
    $main.textContent = expr === "" ? "0" : prettyExpr(expr);
    fitMain();
    let preview = "";
    const full = closedExpr();
    if (full && /[+−×÷%(]/.test(full.replace(/^−/, ""))) {
      try { preview = "= " + formatNumber(evaluate(full)); } catch (_) { preview = ""; }
    }
    $sub.textContent = preview;
  }

  const $tape = document.getElementById("tape");
  const $count = document.getElementById("count");
  const $clearTape = document.getElementById("clear-tape");
  function renderTape() {
    $tape.replaceChildren();
    $count.textContent = history.length ? history.length + " 条" : "";
    $clearTape.disabled = !history.length;
    if (!history.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "暂无记录。按下 = 后，算式和结果会出现在这里，点击任意一条可取回结果继续计算。";
      $tape.appendChild(li);
      return;
    }
    history.forEach(item => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.title = "使用这个结果";
      const e = document.createElement("span"); e.className = "e"; e.textContent = prettyExpr(item.e);
      const r = document.createElement("span"); r.className = "r"; r.textContent = formatNumber(item.r);
      b.append(e, r);
      b.addEventListener("click", () => {
        expr = item.e; lastResult = item.r; evaluated = true; errorMsg = "";
        render();
      });
      li.appendChild(b);
      $tape.appendChild(li);
    });
  }

  // ---------- 存储（只保存在本机浏览器） ----------
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr)) return arr.filter(x => x && typeof x.e === "string" && typeof x.r === "number");
    } catch (_) {}
    return [];
  }
  function saveHistory() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch (_) {}
  }

  // ---------- 事件 ----------
  let longPressTimer = null, longPressed = false;
  $clr.addEventListener("pointerdown", () => {
    longPressed = false;
    if (!clrIsBackspace()) return;
    longPressTimer = setTimeout(() => { longPressed = true; input("AC"); }, 550);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t =>
    $clr.addEventListener(t, () => clearTimeout(longPressTimer)));

  document.getElementById("keys").addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if (!b) return;
    if (b === $clr && longPressed) { longPressed = false; return; }
    input(b.dataset.k);
  });

  const keyMap = {
    "+": "+", "-": "−", "*": "×", "x": "×", "X": "×", "/": "÷",
    "(": "(", ")": ")", "%": "%", ".": ".", ",": ".",
    "Enter": "=", "=": "=", "Backspace": "BS", "Escape": "AC", "Delete": "AC",
  };
  const flashFor = { "(": "()", ")": "()", "BS": "CLR", "AC": "CLR" };
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = /^[0-9]$/.test(e.key) ? e.key : keyMap[e.key];
    if (!k) return;
    // 焦点在历史记录或清除按钮上时，Enter 交给按钮自身；计算器按键上 Enter 一律表示 =
    const ae = document.activeElement;
    if (e.key === "Enter" && ae && ae.matches("button") && !ae.closest("#keys")) return;
    e.preventDefault();
    const btn = document.querySelector(`[data-k="${CSS.escape(flashFor[k] || k)}"]`);
    if (btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 110); }
    input(k);
  });

  const $toast = document.getElementById("toast");
  function copyResult() {
    const text = (evaluated && lastResult !== null) ? numberToExpr(lastResult).replace("−", "-") : $main.textContent;
    const done = () => { $toast.classList.add("show"); setTimeout(() => $toast.classList.remove("show"), 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, selectMain);
    } else selectMain();
  }
  function selectMain() {
    const r = document.createRange(); r.selectNodeContents($main);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
  const $screen = document.getElementById("screen");
  $screen.addEventListener("click", copyResult);
  $screen.addEventListener("keydown", e => { if (e.key === " ") { e.preventDefault(); copyResult(); } });

  $clearTape.addEventListener("click", () => {
    history = []; saveHistory(); renderTape();
  });

  window.addEventListener("resize", () => { if (!errorMsg) fitMain(); });

  render();
  renderTape();

  // 供测试使用
  window.__calc = { evaluate, input, get expr() { return expr; }, get display() { return $main.textContent; } };
})();
</script>
</body>
</html>
